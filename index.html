<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>나랑 발렌타인 보낼래? 💕</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      overflow: hidden;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 1rem 2rem;
      text-align: center;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .buttons {
      display: flex;
      gap: 5rem;
      position: relative;
    }
    button {
      padding: 1.2rem 3.5rem;
      font-size: 1.8rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }
    #yes {
      background: #ff3366;
      color: white;
      box-shadow: 0 8px 20px rgba(255,51,102,0.4);
    }
    #yes:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 30px rgba(255,51,102,0.6);
    }
    #no {
      background: #555;
      color: white;
      position: absolute;
      transition: all 0.35s ease;
    }
    #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>나랑 발렌타인 보낼래? 💖</h1>

  <div class="buttons">
    <button id="yes">Yes! 💕</button>
    <button id="no">No... 😢</button>
  </div>

  <canvas id="fireworks"></canvas>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const canvas = document.getElementById('fireworks');

    // No 버튼 도망가기 (PC + 모바일)
    function moveNoButton(e) {
      const isTouch = e.type === 'touchstart' || e.type === 'touchmove';
      const clientX = isTouch ? e.touches[0].clientX : e.clientX;
      const clientY = isTouch ? e.touches[0].clientY : e.clientY;

      const rect = noBtn.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - 20;
      const maxY = window.innerHeight - rect.height - 20;

      let newX = clientX + (Math.random() > 0.5 ? 120 : -120);
      let newY = clientY + (Math.random() > 0.5 ? 120 : -120);

      newX = Math.max(20, Math.min(newX, maxX));
      newY = Math.max(20, Math.min(newY, maxY));

      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton);
    noBtn.addEventListener('touchmove', (e) => e.preventDefault());

    // Yes 클릭 시 폭죽
    yesBtn.addEventListener('click', () => {
      canvas.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      // 간단한 폭죽 파티클
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height * 0.6;
          const size = Math.random() * 6 + 3;
          ctx.fillStyle = `hsl(${Math.random() * 360}, 100%, 60%)`;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }, i * 30);
      }

      setTimeout(() => {
        alert("우와아아아 🎉💖 진짜로?! 사랑해~");
      }, 1500);
    });
  </script>

</body>
</html>
